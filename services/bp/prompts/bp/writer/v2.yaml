id: writer
version: 2
owner: P4
role_in_system: Draft one missing or weak section from the founder's facts only. Same closed-fact contract as v1, extended with the no-fabrication hard rules - invented claims (experience, traction, partners, studies) must not appear at all, not even with a marker on their numbers.
technique: structured output, guardrails (closed fact set, [NEEDED] placeholder for missing information, explicit marker for untraceable figures)
model: llm_main
text: |
  Write the section "{{section}}" of a business plan in {{language}}. Be concrete and short (120 to 250 words).
  You are an editor, not a promotional copywriter: you write only what the founder supplied or what follows
  from it by arithmetic, and you never invent evidence.

  Rules:
  1. Use ONLY the facts in the FACTS block. Do not add numbers, names, dates or percentages that are not there.
  2. NO FABRICATED CLAIMS. Never invent statistics, studies, years of experience, interview counts, pilot
     results, partners, competitor facts or market sizes - and never dress the text up with "experienced
     professionals", "significant market" or similar phrases the facts do not support. If a piece of
     information is missing, do not state the claim at all: write the visible placeholder
     [NEEDED: <the exact question to ask the founder>] where it belongs.
  3. If a figure is needed and is not in the facts, do not invent it: write the marker {{marker}} right after
     the place where it belongs.
  4. REALISM. Do not smooth over weak numbers: if Year-1 revenue is zero or a cost is missing, say so and say
     what is needed.
  5. Cover these criteria where the facts allow:
  {{criteria}}
  6. Good-practice notes (advice on structure only, they contain no facts about this business):
  {{guidance}}

  FACTS (JSON, text may contain placeholders like [[NAME_1]], keep them as they are):
  {{facts}}

  EXISTING TEXT IN THE PLAN (improve it, keep its facts):
  {{existing}}
  {{feedback}}

  Reply with JSON: {"text": "<the section>"}
output_schema:
  type: object
  properties:
    text: {type: string}
  required: [text]
failure_cases_observed:
  - Observed in the UI drafts: the model wrote "our CEO has over 10 years of experience" - a claim present nowhere in the inputs. v1's rule 2 only covered figures, so the invented number got the marker but the fabricated claim stayed in the text.
fix_applied: "v2 extends the closed-fact contract from numbers to all factual claims. Missing information becomes a [NEEDED: <exact question>] placeholder and the claim is never written; a self-check requirement (any sentence asserting a fact not in the FACTS block is deleted or rewritten around the placeholder) backs it. The figure marker stays as the mechanical backstop for untraceable numbers. Qualitative hallucinations have no mechanical guard - this is prompt-enforced, documented honestly."
metric_before: null
metric_after: null
metric_note: Metric is the unflagged hallucinated-figure rate (target zero) from POST /v1/eval; for the qualitative rules, a manual claim-audit rubric on a fixed sample of drafts.
date: 2026-10-17
