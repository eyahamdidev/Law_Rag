services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: ""            # embedded Qdrant in ./data; set to http://qdrant:6333 with the ml profile
      BP_SERVICE_URL: http://bp:8104
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - ./law:/app/law:ro
      - ./grants_and_financial_aids:/app/grants_and_financial_aids:ro
      - ./business_plan:/app/business_plan:ro
      - ./fraud_detection:/app/fraud_detection
      - ./data:/app/data        # chunks, embedding cache, vectors, OCR text, sessions, uploads
    depends_on:
      - bp

  # Business plan service (services/bp/), its own image and lockfile. Model access comes
  # from .env (LLM_BASE_URL / LLM_API_KEY / LLM_MODEL_*): Groq by default. The branch's
  # bundled Ollama containers are not used.
  bp:
    build: ./services/bp
    ports:
      - "8104:8104"
    env_file:
      - .env
    environment:
      UPLOADS_DIR: /data/uploads
    volumes:
      - ./data/uploads:/data/uploads

  # Automation backbone: chat channels, uploads, scheduled jobs. Workflows in n8n/.
  n8n:
    image: n8nio/n8n:1.88.0
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Africa/Tunis
      API_BASE_URL: http://api:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["ml"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.1
    profiles: ["ml"]
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

volumes:
  qdrant_storage:
  n8n_data:
