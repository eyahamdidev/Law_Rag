services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./law:/app/law:ro
      - ./grants_and_financial_aids:/app/grants_and_financial_aids:ro
      - ./fraud_detection:/app/fraud_detection
      - uploads:/data/uploads
    environment:
      BP_SERVICE_URL: http://bp:8104
      UPLOADS_DIR: /data/uploads
      # Local models are slow: let the gateway wait as long as bp itself may take.
      BP_TIMEOUT_S: ${BP_TIMEOUT_S:-600}
    depends_on:
      - bp

  # P4 business plan. Own image, own lockfile. Talks to the bundled Ollama below by default;
  # set LLM_BASE_URL/LLM_API_KEY to use a hosted OpenAI-compatible API instead, or
  # `docker compose up api bp --no-deps` to run fully deterministic (no model).
  bp:
    build: ./services/bp
    ports:
      - "8104:8104"
    environment:
      UPLOADS_DIR: /data/uploads
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-qwen2.5:7b}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-qwen2.5:7b}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-180}
      BP_TIMEOUT_S: ${BP_TIMEOUT_S:-600}
      BP_LLM: ${BP_LLM:-auto}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  # Bundled language model server. The bp service reaches it at http://ollama:11434/v1.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # NVIDIA GPU (much faster inference): install the NVIDIA Container Toolkit, then uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pull the model into the shared ollama_models volume on first boot.
  # bp waits for this, so `docker compose up` is only "ready" once the model is usable.
  # First boot downloads the model (~4.7 GB for qwen2.5:7b); afterwards it is cached in the volume.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL_MAIN:-qwen2.5:7b}"]
    restart: "no"

  # Planned services from the architecture deck. They are not required to boot the scaffold.
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["ml"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.1
    profiles: ["ml"]
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

volumes:
  uploads:
  qdrant_storage:
  ollama_models:
