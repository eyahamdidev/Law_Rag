services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./law:/app/law:ro
      - ./grants_and_financial_aids:/app/grants_and_financial_aids:ro
      - ./fraud_detection:/app/fraud_detection

  # Planned services from the architecture deck. They are not required to boot the scaffold.
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["ml"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.1
    profiles: ["ml"]
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

volumes:
  qdrant_storage:
