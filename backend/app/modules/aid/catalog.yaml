    source_page: 1
    official_form_link: "https://anme.tn"
    required_documents:
      - "Extrait du registre de commerce de la société, datant de moins de 3 mois"
      - "Dossier technique de la solution écologique et mesure de l'impact environnemental"
      - "Factures proforma des équipements verts / certifications"
    local_files:
      - "grants_and_financial_aids/International_donors_accelerators_and_calls/Greentech_Call.pdf"
