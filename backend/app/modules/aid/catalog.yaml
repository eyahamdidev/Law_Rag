  - id: "investment-regional-premium"
    name: "Prime de Développement Régional (Loi 2016-71 & Décret 2017-389)"
    provider: "TIA (Tunisia Investment Authority) / APII"
    program_type: "grant"
    summary: "Subvention financière directe de 15% (Groupe 1) ou 30% (Groupe 2) du coût d'investissement approuvé plafonné à 1.5M ou 3M TND dans les zones de développement régional."
    stages: ["creation", "extension"]
    sectors: ["industrie", "services", "tic", "technologie", "agroalimentaire", "artisanat", "energies_renouvelables", "recyclage", "greentech"]
    excluded_sectors: ["commerce_detail", "commerce_pur", "commerce_traditionnel"]
    # Governorates with at least one zone in Annexe 2 of décret 2017-389 (pages 16-19).
    # Zones are delegations: in a listed governorate only the listed delegations qualify.
    allowed_governorates:
      - "jendouba"
      - "kasserine"
      - "kairouan"
      - "siliana"
      - "sidi bouzid"
      - "kef"
      - "tataouine"
      - "beja"
      - "gafsa"
      - "medenine"
      - "mahdia"
      - "gabes"
      - "kebili"
      - "zaghouan"
      - "tozeur"
      - "bizerte"
      - "sfax"
      - "sousse"
    requires_innovation: false
    requires_label: false
    requires_graduate: false
    source_file: "grants_and_financial_aids/Investment_incentives/linked/S012_Decret2017_389_Fr.pdf"
    source_page: 4
    conditions:
      zones_by_delegation: "Annexe 2, pages 16-19"
    official_form_link: "https://myinvest.tia.gov.tn"
    required_documents:
      - "Attestation de dépôt de déclaration d'investissement (TIA ou APII)"
      - "Étude technico-économique validée avec plan d'investissement détaillé"
      - "Contrat de propriété ou de location du terrain / local dans la zone éligible"
      - "Attestation de libération d'au moins 30% des fonds propres"
    local_files:
      - "grants_and_financial_aids/Investment_incentives/linked/S012_Decret2017_389_Fr.pdf"

