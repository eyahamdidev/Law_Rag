# Versioned catalog of Tunisian funding and aid programs.
# Provenance is strictly tracked: each rule references source_file and source_page.
# Do not guess rules: unknown constraints remain unconstrained.
# `unverified` holds figures that are not stated in the cited source. The rules engine
# ignores them (the criterion stays unconstrained) and answers show them as "to confirm".
# Move a figure back to its active field only with a source_file/page that states it.

programs:
  - id: "bfpme-creation"
    name: "BFPME — Crédit de Création PME"
    provider: "BFPME (Banque de Financement des Petites et Moyennes Entreprises)"
    program_type: "loan"
    summary: "Financement à moyen et long terme des projets de création de PME dans l'industrie et les services liés."
    stages: ["creation"]
    sectors: ["industrie", "services", "tic", "technologie", "agroalimentaire", "sante", "energies_renouvelables", "software"]
    excluded_sectors: ["commerce_pur", "commerce_detail", "immobilier", "activites_financieres", "commerce_traditionnel"]
    unverified:
      min_investment_tnd: 100000
      max_investment_tnd: 15000000
      reason: "not stated on the cited page or elsewhere in the cited document (checked 2026-10-18); source requested from the catalogue author"
    requires_innovation: false
    requires_label: false
    requires_graduate: false
    source_file: "grants_and_financial_aids/BFPME/Checklist_Creation_Entreprise.pdf"
    source_page: 1
    official_form_link: "grants_and_financial_aids/BFPME/Demande_Financement_BFPME_2024.doc"
    required_documents:
      - "Copie de la CIN du promoteur et des associés"
      - "CV détaillé et copies des diplômes universitaires / certificats"
      - "Statuts de la société ou projet de statuts (SARL, SUARL, SA)"
      - "Plan d'affaires complet (Business Plan) et étude technico-économique"
      - "Factures proforma détaillées pour les équipements prévus"
      - "Promesse de bail ou titre de propriété du local d'exploitation"
      - "Schéma de financement projeté et justification des fonds propres (minimum 20%-30%)"
    local_files:
      - "grants_and_financial_aids/BFPME/Checklist_Creation_Entreprise.pdf"
      - "grants_and_financial_aids/BFPME/Checklist_Demande_Financement.pdf"
      - "grants_and_financial_aids/BFPME/Checklist_Notification_Financement.pdf"
      - "grants_and_financial_aids/BFPME/Checklist_Deblocage.pdf"
      - "grants_and_financial_aids/BFPME/Demande_Financement_BFPME_2024.doc"
      - "grants_and_financial_aids/Business_Plan_Models/Modele_Business_Plan_Creation.xls"

