  - id: "greentech-call"
    name: "Appel à Projets Greentech & Transition Écologique"
    provider: "Ministère de l'Environnement / ANME"
    program_type: "grant"
    summary: "Subvention et assistance technique pour les projets et startups innovantes dans la transition écologique, l'énergie propre et l'économie circulaire."
    stages: ["creation", "early", "growth"]
    sectors: ["greentech", "cleantech", "environnement", "energies_renouvelables", "recyclage", "agriculture_durable"]
    excluded_sectors: ["commerce_detail", "commerce_pur"]
    requires_innovation: true
    requires_label: false
    requires_graduate: false
