  - id: "startup-act"
    name: "Startup Act — Label Startup & Avantages Fiscaux/Sociaux"
    provider: "Startup Tunisia / Ministère des Technologies de la Communication"
    program_type: "tax_incentive"
    summary: "Cadre légal accordant le Label Startup (Loi 2018-20 & Décret 2018-840): exonération d'IS, prise en charge des charges patronales CNSS, bourse de startup et compte devises."
    stages: ["idea", "creation", "growth"]
    sectors: ["technologie", "tic", "digital", "deeptech", "fintech", "edtech", "healthtech", "cleantech", "greentech", "software", "energies_renouvelables"]
    excluded_sectors: ["commerce_traditionnel", "commerce_pur", "activites_non_innovantes", "commerce_detail"]
    max_employees: 100
    requires_innovation: true
    requires_label: false
    requires_graduate: false
    conditions:
      max_company_age_years: 8
      innovation_scalability: true
    # 100 employees: Décret 2018-840 art. 3 (this page); 8 years: Loi 2018-20 art. 3.
    source_file: "law/TUNISIA_LEGAL_BUSINESS_CORPUS/01_STARTUPS/01_STARTUP_ACT/Decret_2018-840_Startup_Implementation/JORT_2018-10-19_N84_FR_Decret_2018-840.pdf"
    source_page: 24
    official_form_link: "https://startup.gov.tn"
    required_documents:
      - "Pitch Deck complet présentant l'innovation technologique ou d'usage et la scalabilité"
      - "Extrait RNE récent (si la société est déjà immatriculée)"
      - "CV des fondateurs et tableau de répartition du capital (Cap Table)"
      - "Dépôt du dossier sur le portail national startup.gov.tn"
    local_files:
      - "grants_and_financial_aids/Startup_Act_and_national_startup_funding_programme/S005_Startup_Act_Law_2018_20_and_label_procedures_Startup_Act_pag.pdf"

