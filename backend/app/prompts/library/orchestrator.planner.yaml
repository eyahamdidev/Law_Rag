    observed_failures:
      - >-
        2026-10-12, routing eval (60 messages, qwen3.8-27b): Macro-F1 0.725 vs 0.763 for the keyword baseline, exact match 0.83. All 10 errors were the planner returning no step and a clarification although the topic was clear. (a) All 7 document-review messages (fraud F1 = 0.00), e.g. "This invoice from a supplier looks suspicious, can you check it?" -> "Please upload the invoice", because no file was attached. (b) Over-clarification on clear topics: "Who are my competitors and how do I position against them?" and "Combien coûte le lancement de mon projet et où trouver le financement ?" -> asked for the sector first. Missing facts belong to the agents (missing_info); the planner decides the topic.
  - version: v4
    date: 2026-10-12
    changes: >-
      Clarification is now reserved for messages whose topic cannot be identified. Missing facts (sector, amount, region) and a missing document no longer block routing: the agent receives the task and asks for what it needs. Document-review requests always go to the fraud agent.
    techniques:
      - role prompting
      - structured output (JSON object, fixed keys, typed and enumerated values)
      - tool/agent cards injected as context
      - query translation (French search query)
      - guardrails (max 3 agents, clarify instead of guessing, out-of-scope flag)
      - few-shot examples (query translation)
      - negative constraint (no invented identifiers)
      - responsibility split (planner decides topic, agents collect facts)
