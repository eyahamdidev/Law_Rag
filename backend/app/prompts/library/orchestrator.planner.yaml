      - >-
        2026-10-12, live run: "ما هي مدة العطلة لبعث مؤسسة ناشئة؟" (how long is the leave to create a startup?) -> search_query "durée validité label startup loi 2016-21 Tunisie". Two errors: عطلة (leave, congé) was translated as label validity, and the model added a law number that is wrong (the Startup Act is law 2018-20) and that the founder never wrote. A wrong number in the query pulls BM25 toward unrelated texts.
  - version: v3
    date: 2026-10-12
    changes: >-
      search_query rules: translate the founder's need word for word into French legal vocabulary, never add law or decree numbers, years or article numbers the founder did not write, and keep it to keywords. Three worked examples, including the Arabic leave question that failed.
    techniques:
      - role prompting
      - structured output (JSON object, fixed keys, typed and enumerated values)
      - tool/agent cards injected as context
      - query translation (French search query)
      - guardrails (max 3 agents, clarify instead of guessing, out-of-scope flag)
      - few-shot examples (query translation)
      - negative constraint (no invented identifiers)
